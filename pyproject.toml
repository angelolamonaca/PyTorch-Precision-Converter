[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-precision-converter"
dynamic = ["version"]
description = "Convert PyTorch checkpoints, safetensors and Hugging Face models to fp16, bf16, fp8 or ComfyUI fp8_scaled; dequantize FP8 (DeepSeek, Qwen) to BF16 on CPU; merge or split shards; extract EMA weights."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Angelo Lamonaca" }]
requires-python = ">=3.9"
# numpy is only needed to unpickle older checkpoints that store numpy scalars.
dependencies = ["torch>=2.1", "safetensors>=0.4.3", "numpy"]
keywords = [
    "pytorch", "safetensors", "fp16", "bf16", "fp8", "fp8_scaled", "float8", "e4m3fn", "comfyui",
    "huggingface", "transformers", "diffusers", "dequantize", "deepseek", "qwen", "checkpoint", "ckpt",
    "model-conversion", "mixed-precision", "quantization", "shards", "stable-diffusion", "flux", "lora", "ema",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
precision-convert = "precision_converter.cli:main"

[project.urls]
Homepage = "https://github.com/angelolamonaca/PyTorch-Precision-Converter"
Documentation = "https://github.com/angelolamonaca/PyTorch-Precision-Converter#how-to"
Source = "https://github.com/angelolamonaca/PyTorch-Precision-Converter"
Issues = "https://github.com/angelolamonaca/PyTorch-Precision-Converter/issues"
Changelog = "https://github.com/angelolamonaca/PyTorch-Precision-Converter/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["precision_converter"]

[tool.setuptools.package-data]
precision_converter = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "precision_converter.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
